baseURL = 'https://dersavage.github.io/tutorials/'
title = 'Tutorials'
theme = 'hugo-book'
disablePathToLower = true

[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
[markup.highlight]
  style = 'github'

[params]
  BookSection = 'docs'
  BookToC = true
  BookSearch = false
  BookTheme = 'auto'
  BookCollapseSection = true
  BookComments = false

[[menus.after]]
  name = 'Main site'
  url = 'https://dersavage.github.io/site/'
